<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>確認用マルチ画面 ／ 神センス0.15チャレンジ</title>
<style>
  :root{--bg:#070c11;--pan:#0e1620;--line:#1e2a36;--ink:#dbe8f2;--mut:#8fa6ba;--red:#ff5a4d;--gold:#f6c343;--blue:#2f7bff;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic",sans-serif;}
  .bar{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#0a121a;}
  .bar b{font-size:15px;font-weight:900;letter-spacing:.02em;}
  .bar .sp{flex:1;}
  .bar select,.bar button{font:inherit;font-size:13px;font-weight:800;color:var(--ink);background:#13202c;border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;}
  .bar button.go{background:linear-gradient(180deg,#2f7bff,#1a5fe0);border-color:#2f7bff;color:#fff;}
  .bar button.go:disabled{opacity:.5;cursor:default;}
  .bar button.res{background:#1c2a1c;border-color:#2f4f2f;color:#bfe6bf;}
  .bar .st{font-size:12px;color:var(--mut);min-width:180px;}
  .bar .step{font-size:11px;font-weight:900;letter-spacing:.08em;color:var(--gold);background:#1a1408;border:1px solid #3a2f12;border-radius:8px;padding:6px 10px;}
  .bar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ad07a;margin-right:5px;vertical-align:middle;}
  .grid{display:grid;grid-template-columns:1.55fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;padding:8px;height:calc(100vh - 52px);}
  .panel{background:var(--pan);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;min-height:0;}
  .panel h3{margin:0;padding:6px 11px;font-size:12px;font-weight:900;color:var(--ink);background:#12202c;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;}
  .panel h3 .tag{font-size:10px;font-weight:800;padding:1px 7px;border-radius:6px;background:#1d2f40;color:#9fc0e0;}
  .fr{flex:1;position:relative;min-height:0;background:#000;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .p-screen{grid-column:1;grid-row:1 / span 2;}
  .p-admin{grid-column:2 / span 2;grid-row:1;}
  .p-player{grid-column:2;grid-row:2;}
  .p-voter{grid-column:3;grid-row:2;}
</style>
</head>
<body>
  <div class="bar">
    <b>🖥 確認用マルチ画面</b>
    <span class="tag" style="font-size:11px;color:var(--mut)">投影・運営・挑戦者・投票者を同時表示</span>
    <span class="sp"></span>
    <span class="st"><span class="dot"></span><span id="st">待機中</span></span>
    <select id="venue" title="会場BGM">
      <option value="naruto">1部 鳴門</option>
      <option value="kojima">2部 児島</option>
      <option value="marugame">3部 丸亀</option>
    </select>
    <span class="step" id="stepno">STEP 0</span>
    <button class="go" id="next">▶ 次へ</button>
    <button class="res" id="reset">ロビーに戻す</button>
  </div>
  <div class="grid">
    <div class="panel p-screen"><h3>📺 投影（大画面） <span class="tag">/screen</span></h3><div class="fr"><iframe id="if_screen" src="/screen"></iframe></div></div>
    <div class="panel p-admin"><h3>🎛 運営 <span class="tag">/admin（ミラー）</span></h3><div class="fr"><iframe src="/admin?mirror=1"></iframe></div></div>
    <div class="panel p-player"><h3>🏁 挑戦者・1号艇 安里信弦（スマホ） <span class="tag">/player（自動）</span></h3><div class="fr"><iframe src="/player?auto=1&name=%E5%AE%89%E9%87%8C%E4%BF%A1%E5%BC%A6"></iframe></div></div>
    <div class="panel p-voter"><h3>🎫 観客・投票（スマホ） <span class="tag">/vote</span></h3><div class="fr"><iframe src="/vote"></iframe></div></div>
  </div>

<script>
const N=6;
const NAMES=['安里信弦','毒島誠','石野貴之','茅原悠紀','遠藤エミ','白井英治'];   // 空き枠を埋めるデモ名（1号艇=安里信弦）
const STS=[0.10,0.22,0.04,-0.06,0.13,0.31];       // 未PUSH枠を埋めるデモST（3号艇0.04=神スタート / 4号艇フライング）
const VOTES=[3,1,9,2,6,1];
const post=(m)=>fetch('/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(m)});
const getState=async()=>{ try{ const r=await fetch('/state',{cache:'no-store'}).then(r=>r.json()); return (r&&r.state&&r.state.s)?r.state.s:null; }catch(e){ return null; } };
const stEl=document.getElementById('st'), nextBtn=document.getElementById('next'), stepnoEl=document.getElementById('stepno'), venueSel=document.getElementById('venue');
function status(t){ stEl.textContent=t; }
function base(){ return {phase:'lobby',round:1,venue:venueSel.value,names:Array(N).fill(null),joined:Array(N).fill(false),votes:Array(N).fill(0),results:Array(N).fill(null),goSeq:0}; }
let s=base(), step=0;
async function push(msg){ s.venue=venueSel.value; await post({type:'state',src:'admin',s}); if(msg)status(msg); }

// 1タップ＝1ステップの進行管理。発走→結果は運営が大時計を見届けてから次を押す＝自分のペースで進められる。
const STEPS=[
  {b:'① エントリー', run:async()=>{ const c=await getState(); if(c)s=c; s.phase='lobby'; s.round=s.round||1;
      for(let i=0;i<N;i++){ if(!s.joined[i]){ s.joined[i]=true; s.names[i]=NAMES[i]; } }   // 実参加の挑戦者は残し、空き枠だけデモ名で補完
      await push('① エントリー（'+s.joined.filter(Boolean).length+'艇）'); }},
  {b:'② 投票フェーズへ', run:async()=>{ s.phase='vote'; await push('② 投票受付中'); }},
  {b:'③ 予想投票を集める', run:async()=>{ for(let i=0;i<N;i++) s.votes[i]+=VOTES[i]; await push('③ 投票 '+s.votes.reduce((a,b)=>a+b,0)+'票'); }},
  {b:'④ 発走！（ファンファーレ→大時計）', run:async()=>{ s.phase='countdown'; s.results=Array(N).fill(null); s.goSeq=(s.goSeq||0)+1; s.goAt=Date.now()+20500;
      await push('④ 発走！ ファンファーレ鳴り切り→大時計→PUSH（見届けたら⑤へ）'); }},
  {b:'⑤ 結果発表', run:async()=>{ const c=await getState(); const rs=(c&&c.results)?c.results.slice():Array(N).fill(null);
      for(let i=0;i<N;i++){ if(rs[i]==null) rs[i]=STS[i]; }   // 挑戦者が実際にPUSHした結果を優先、未PUSHの枠だけデモ値で補完
      s.results=rs; s.phase='result'; await push('⑤ 結果発表'); }},
  {b:'⑥ 商品プレゼント 🎁', run:async()=>{ s.phase='prize'; await push('⑥ 商品プレゼント'); }},
  {b:'▶ 次のラウンドへ', run:async()=>{ s.votes=Array(N).fill(0); s.results=Array(N).fill(null); s.round=(s.round||1)+1; s.phase='vote'; await push('R'+s.round+' 投票受付中'); return 2; }},
];
function refresh(){ nextBtn.textContent='▶ '+STEPS[step].b; stepnoEl.textContent='STEP '+(step+1)+'/'+STEPS.length; }
nextBtn.onclick=async()=>{ nextBtn.disabled=true; try{ const nx=await STEPS[step].run(); step=(typeof nx==='number')?nx:(step+1); if(step>=STEPS.length)step=STEPS.length-1; refresh(); }catch(e){ status('失敗: '+e); } nextBtn.disabled=false; };
document.getElementById('reset').onclick=async()=>{ s=base(); step=0; await push('ロビーにリセット'); refresh(); };
// 会場変更は投影のBGM切替に反映
venueSel.onchange=async()=>{ const c=await getState(); if(c)s=c; s.venue=venueSel.value; await post({type:'state',src:'admin',s}); status('会場→'+venueSel.options[venueSel.selectedIndex].text); };
refresh();
</script>
</body>
</html>
