<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投影 ／ 神センス0.15チャレンジ</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>
  /* ===== 16:9 横型モニター固定（1280×720キャンバスをスケール） ===== */
  html,body{height:100%; margin:0; overflow:hidden; background:#000;}
  #tv{position:absolute; top:50%; left:50%; width:1280px; height:720px; overflow:hidden; background:var(--bg0);
      transform-origin:center center; transform:translate(-50%,-50%) scale(1); container-type:size;}
  #tv .wrap{max-width:1100px; margin:0 auto; min-height:100%; height:100%;}
  #tv .screen{max-width:1100px; margin:0 auto;}
  /* vw/vh を canvas基準(cqw/cqh)へ置換し、どの表示枠でも16:9で同じ見た目に固定 */
  #tv .g-teal{width:130cqw; height:80cqh; left:-15cqw; top:-34cqh;}
  #tv .g-orange{width:90cqw; height:65cqh; right:-25cqw; bottom:-30cqh;}
  #tv .title{font-size:clamp(30px,7.5cqw,56px);}
  #tv .qtext{font-size:clamp(17px,3.6cqw,23px);}
  #tv .qrjoin{gap:6cqw; margin-top:2.6cqh;}
  #tv .binfo .nm{font-size:clamp(15px,3.4cqw,19px);}
  #tv .odds{font-size:clamp(19px,4.6cqw,25px);}
  #tv .stc{font-size:clamp(19px,4.6cqw,26px);}
  #tv .cdnum{font-size:clamp(88px,26cqw,150px);}
  #tv .blindmsg .big{font-size:clamp(26px,7cqw,38px);}
  #tv .paywin{font-size:clamp(26px,6.5cqw,46px);}
  #tv .paymul{font-size:clamp(64px,18cqw,120px);}
  /* 上位3名の表彰台（賞品対象）*/
  .podium{display:flex; gap:1.8cqw; justify-content:center; align-items:stretch; margin-top:2.4cqh; flex-wrap:nowrap;}
  .pod{position:relative; width:22cqw; max-width:258px; border-radius:20px; padding:18px 14px 16px; background:linear-gradient(180deg,rgba(8,32,50,.72),rgba(5,22,36,.82)); box-shadow:inset 0 0 0 2px rgba(255,255,255,.14), 0 14px 40px rgba(0,45,75,.4);}
  .pod.r1{outline:3px solid var(--gold); box-shadow:inset 0 0 0 2px rgba(255,255,255,.2), 0 16px 46px rgba(255,190,40,.35);}
  .pod .medal{font-size:clamp(30px,6cqw,48px); line-height:1;}
  .pod .rk{font-family:var(--lab); letter-spacing:.24em; font-size:clamp(12px,1.8cqw,16px); color:#bfe0f2; margin-top:4px;}
  .pod .kw{width:clamp(48px,8cqw,72px); height:clamp(48px,8cqw,72px); font-size:clamp(24px,4.6cqw,40px); margin:10px auto 0;}
  .pod .pnm{font-family:var(--jp); font-weight:900; font-style:italic; font-size:clamp(18px,3.4cqw,28px); color:#fff; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pod .pst{font-family:var(--disp); font-size:clamp(22px,4.4cqw,36px); color:var(--gold); margin-top:4px;}
  .pod .pst small{font-family:var(--jp); font-size:.4em; color:#bfe0f2;}
  .lobbyboats{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:22px;}
  .lb{position:relative; width:92px; text-align:center;}
  .lb .kw{width:62px;height:62px;font-size:30px; margin:0 auto;}
  .lb .lbn{margin-top:7px; font-weight:800; font-size:14px; min-height:1.2em;}
  .qrcta{margin-top:2.4cqh; font-family:var(--jp); font-weight:900; font-style:italic; font-size:clamp(20px,3cqw,34px); color:transparent; background:linear-gradient(180deg,var(--gold),var(--orange)); -webkit-background-clip:text; background-clip:text;}
  .qrjoin .qrcard{padding:18px 18px 12px;}
  .qrjoin .qrcard .qimg{width:min(26cqw,260px); height:min(26cqw,260px);}
  .qrjoin .qrcard .qlbl{font-size:clamp(15px,2cqw,22px);}
  .lb.empty{opacity:.35;}
  .lb .waitdot{font-family:var(--lab); font-size:12px; color:var(--muted);}
  .joinurls{margin-top:26px; display:flex; gap:30px; justify-content:center; flex-wrap:wrap; font-family:var(--lab); font-size:18px;}
  .joinurls b{color:var(--gold);} .joinurls code{background:rgba(255,255,255,.08); padding:4px 12px; border-radius:8px;}
  .bigcount{margin-top:16px; font-family:var(--jp); font-weight:900; font-style:italic; font-size:clamp(22px,4cqw,34px); color:var(--gold);}
  /* ===== 結果発表レース演出 ===== */
  #s_reveal{position:absolute; inset:0; z-index:6; display:none; overflow:hidden; background:radial-gradient(120% 90% at 50% 18%,#cdeefb,#9bdcf2 62%,#6fc6e8); cursor:pointer;}
  #s_reveal.on{display:block;}
  #revealCanvas{position:absolute; inset:0; width:1280px; height:720px;}
  .rev-title{position:absolute; top:33%; left:0; right:0; text-align:center; font-family:var(--jp); font-weight:900; font-style:italic; font-size:74px; letter-spacing:.04em; color:transparent; background:linear-gradient(180deg,#fff,#bfe6ff 55%,#7fd0ff); -webkit-background-clip:text; background-clip:text; filter:drop-shadow(0 8px 30px rgba(47,228,255,.45)); opacity:0; transform:scale(.9); transition:opacity .4s,transform .4s; pointer-events:none;}
  .rev-title.show{opacity:1; transform:scale(1);}
  .rev-title .sub{display:block; font-size:20px; font-family:var(--lab); letter-spacing:.32em; font-style:normal; -webkit-text-fill-color:#8fb3c8; margin-top:10px;}
  .rev-winner{position:absolute; left:0; right:0; top:8%; padding:22px 0 30px; text-align:center; opacity:0; transform:translateY(26px); transition:opacity .5s cubic-bezier(.2,.8,.3,1),transform .5s cubic-bezier(.2,.8,.3,1); pointer-events:none; text-shadow:0 3px 16px rgba(0,0,0,.75); background:radial-gradient(90% 130% at 50% 30%, rgba(3,11,18,.82), rgba(3,11,18,0) 72%);}
  .rev-winner.show{opacity:1; transform:translateY(0);}
  .rev-winner .lbl{font-family:var(--lab); letter-spacing:.34em; font-size:20px; color:#ffe08a;}
  .rev-winner .nm{font-family:var(--jp); font-weight:900; font-style:italic; font-size:72px; line-height:1.05; margin-top:8px; color:#fff; display:flex; gap:22px; align-items:center; justify-content:center; padding:0 40px;}
  .rev-winner .kwbig{flex:none; width:84px; height:84px; border-radius:16px; display:grid; place-items:center; font-family:var(--disp); font-size:44px; transform:skewX(-8deg); background:linear-gradient(155deg,rgba(255,255,255,.6),rgba(255,255,255,0) 46%),var(--bc,#888); box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 8px 22px rgba(0,0,0,.5),0 0 30px -4px var(--bc,#888); -webkit-text-fill-color:var(--bt,#fff); color:var(--bt,#fff);}
  .rev-winner .st{font-family:var(--disp); font-size:36px; color:#fff; margin-top:14px; letter-spacing:.06em;}
  .rev-winner .st b{color:var(--gold); font-size:54px;}
  .rev-winner .champ{display:inline-block; font-family:var(--lab); font-weight:900; letter-spacing:.22em; font-size:16px; color:#3a2600; background:linear-gradient(180deg,#ffe9a8,var(--gold)); padding:5px 16px; border-radius:9px; transform:skewX(-6deg); margin-bottom:12px; box-shadow:0 8px 22px rgba(255,210,74,.45);}
  .rev-winner .nmtxt{display:inline-block; color:transparent; background:linear-gradient(180deg,#fff6d6,var(--gold) 55%,#e89b1c); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 3px 3px rgba(0,0,0,.7)) drop-shadow(0 8px 22px rgba(255,210,74,.45));}
  .rev-vote{position:absolute; left:0; right:0; bottom:11%; text-align:center; opacity:0; transform:translateY(20px); transition:opacity .5s,transform .5s; pointer-events:none;}
  .rev-vote.show{opacity:1; transform:translateY(0);}
  .rev-vote .hit{font-family:var(--jp); font-weight:900; font-size:34px; color:#fff;}
  .rev-vote .hit b{color:var(--cyan); font-size:46px;}
  .rev-vote .sub2{font-family:var(--lab); letter-spacing:.22em; color:#9fc0d8; font-size:16px; margin-top:8px;}
  /* ===== 発走ファンファーレ演出（待機画面を"煽り"に格上げ）===== */
  #fanhype{position:absolute; inset:0; z-index:5; display:none; overflow:hidden; background:radial-gradient(120% 92% at 50% 32%,#07314b,#041c2b 58%,#010a12);}
  #fanhype.on{display:block;}
  #fanhype .fh-rays{position:absolute; left:50%; top:40%; width:200cqw; height:200cqw; transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg, rgba(255,210,74,.10) 0deg 5deg, transparent 5deg 17deg); animation:fhSpin 14s linear infinite; opacity:.55;}
  @keyframes fhSpin{to{transform:translate(-50%,-50%) rotate(360deg);}}
  #fanhype .fh-light{position:absolute; top:-25%; width:30cqw; height:150%; filter:blur(7px); mix-blend-mode:screen; opacity:.55;}
  #fanhype .fh-light.l1{left:10%; background:linear-gradient(90deg,transparent,rgba(47,228,255,.55),transparent); animation:fhSweep1 3.4s ease-in-out infinite;}
  #fanhype .fh-light.l2{right:10%; background:linear-gradient(90deg,transparent,rgba(255,150,40,.55),transparent); animation:fhSweep2 3.9s ease-in-out infinite;}
  @keyframes fhSweep1{0%,100%{transform:translateX(-42cqw) rotate(-9deg);}50%{transform:translateX(42cqw) rotate(9deg);}}
  @keyframes fhSweep2{0%,100%{transform:translateX(42cqw) rotate(9deg);}50%{transform:translateX(-42cqw) rotate(-9deg);}}
  #fanhype .fh-top{position:absolute; top:4.4cqh; left:0; right:0; text-align:center; font-family:var(--lab); letter-spacing:.28em; font-size:clamp(14px,2.2cqw,20px); color:#9fd6f0;}
  #fanhype .fh-top b{color:var(--gold);}
  #fanhype .fh-mid{position:absolute; top:19cqh; left:0; right:0; text-align:center;}
  #fanhype .fh-kicker{font-family:var(--lab); font-weight:700; letter-spacing:.36em; font-size:clamp(15px,2.6cqw,24px);
    color:transparent; background:linear-gradient(90deg,var(--cyan),#fff,var(--gold)); background-size:200% auto; -webkit-background-clip:text; background-clip:text; animation:fhShimmer 2.2s linear infinite;}
  @keyframes fhShimmer{to{background-position:200% center;}}
  #fanhype .fh-title{font-family:var(--jp); font-weight:900; font-style:italic; font-size:clamp(60px,15cqw,132px); line-height:1; margin-top:1cqh;
    color:transparent; background:linear-gradient(180deg,#fff,#ffe9a8 40%,var(--gold) 70%,var(--orange)); -webkit-background-clip:text; background-clip:text;
    filter:drop-shadow(0 6px 26px rgba(255,180,40,.5)); animation:fhPulse 1s ease-in-out infinite;}
  @keyframes fhPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.055);}}
  #fanhype .fh-sub{margin-top:1.4cqh; font-family:var(--jp); font-weight:800; font-size:clamp(18px,3.4cqw,30px); color:#eaf6ff;}
  #fanhype .fh-sub b{color:var(--gold);}
  #fanhype .fh-boats{position:absolute; left:0; right:0; bottom:15cqh; display:flex; gap:2.2cqw; justify-content:center; align-items:flex-end;}
  #fanhype .fh-boat{width:13cqw; max-width:150px; text-align:center; opacity:.32; transform:translateY(6px); transition:opacity .3s;}
  #fanhype .fh-boat.jn{opacity:1;}
  #fanhype .fh-boat.jn .fh-kw{animation:fhRev .16s linear infinite;}
  @keyframes fhRev{0%{transform:skewX(-8deg) translateY(0) rotate(-1.2deg);}50%{transform:skewX(-8deg) translateY(-2px) rotate(1.2deg);}100%{transform:skewX(-8deg) translateY(0) rotate(-1.2deg);}}
  #fanhype .fh-kw{width:6.4cqw; height:6.4cqw; max-width:74px; max-height:74px; margin:0 auto; border-radius:14px; display:grid; place-items:center;
    font-family:var(--disp); font-size:clamp(24px,4.4cqw,42px); transform:skewX(-8deg);
    background:linear-gradient(155deg,rgba(255,255,255,.6),rgba(255,255,255,0) 46%),var(--bc,#888);
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.35),0 8px 20px rgba(0,0,0,.5),0 0 26px -6px var(--bc,#888); color:var(--bt,#fff);}
  #fanhype .fh-kw span{transform:skewX(8deg);}
  #fanhype .fh-nm{margin-top:.8cqh; font-family:var(--jp); font-weight:800; font-size:clamp(13px,2.2cqw,18px); color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #fanhype .fh-boat .boaticon{width:9cqw; max-width:104px; height:auto; margin-top:.3cqh; filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));}
  #fanhype .fh-barwrap{position:absolute; left:12cqw; right:12cqw; bottom:6.5cqh; text-align:center;}
  #fanhype .fh-barlabel{font-family:var(--lab); letter-spacing:.3em; font-size:clamp(12px,1.9cqw,16px); color:#bfe0f2; margin-bottom:1cqh;}
  #fanhype .fh-bar{height:1.5cqh; min-height:10px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);}
  #fanhype .fh-bar i{display:block; height:100%; width:0; border-radius:99px; background:linear-gradient(90deg,var(--cyan),var(--gold),var(--orange)); box-shadow:0 0 18px rgba(255,200,60,.7);}
  #fanhype.rush{background:radial-gradient(120% 92% at 50% 32%,#3a1204,#1c0a04 58%,#0a0402);}
  #fanhype.rush .fh-title{animation:fhPulse .4s ease-in-out infinite; background:linear-gradient(180deg,#fff,#ffdca0 45%,var(--orange)); -webkit-background-clip:text; background-clip:text;}
  #fanhype.rush .fh-boat.jn .fh-kw{animation-duration:.1s;}
  /* ===== LP寄せ背景（瀬戸内3場祭り準拠：シアン＋青海波＋絣ボーダー＋会場キャラ）===== */
  #lpbg{position:absolute; inset:0; z-index:0; display:none; overflow:hidden;
    background-color:#a9e2f6;
    background-image:
      radial-gradient(circle at 100% 150%, transparent 33%, rgba(255,255,255,.55) 34%, rgba(255,255,255,.55) 38%, transparent 39%, transparent 45%, rgba(255,255,255,.55) 46%, rgba(255,255,255,.55) 50%, transparent 51%),
      radial-gradient(circle at 0 150%, transparent 33%, rgba(255,255,255,.55) 34%, rgba(255,255,255,.55) 38%, transparent 39%, transparent 45%, rgba(255,255,255,.55) 46%, rgba(255,255,255,.55) 50%, transparent 51%),
      linear-gradient(180deg,#e6f7fd 0%,rgba(230,247,253,0) 26%),
      linear-gradient(0deg,#7ecdec 0%,rgba(126,205,236,0) 24%);
    background-size:64px 32px,64px 32px,100% 100%,100% 100%;
    background-position:0 0,0 0,0 0,0 100%;}
  #tv.lp #lpbg{display:block;}
  #tv.lp .scene{opacity:0;}   /* 暗い夜景シーンを隠してLP背景に */
  /* ミンサー柄の側帯：LP(瀬戸内3場祭り)から実物を切り出したPNGをそのまま使用 */
  #lpbg::before,#lpbg::after{content:""; position:absolute; top:0; bottom:0; width:40px; z-index:2; box-shadow:0 0 14px rgba(0,60,90,.25);}
  #lpbg::before{left:0;  background:url("img/minsah_left.png")  top left  / 100% auto repeat-y;}
  #lpbg::after{right:0;  background:url("img/minsah_right.png") top right / 100% auto repeat-y;}
  /* 会場キャラ（なるちゃん/スマイル/ガーコ） */
  .lpchar{position:absolute; z-index:3; pointer-events:none; display:none; filter:drop-shadow(0 8px 12px rgba(0,60,90,.28));}
  #tv.lp .lpchar.on{display:block;}
  /* 3体はSVGの縦横比が違うため、高さを統一して見た目のサイズを揃える（幅は自動） */
  .lpchar{height:220px; width:auto;}
  #mascotL{left:1.5%; bottom:4%; animation:floatL 3.2s ease-in-out infinite;}
  #mascotR{right:1.5%; bottom:4%; animation:floatR 3.6s ease-in-out infinite;}
  #mascotC{right:2.5%; top:7%; animation:floatC 2.8s ease-in-out infinite;}
  /* キャラをゆらゆら動かす（会場ごとに位相・向きを変える） */
  @keyframes floatL{0%,100%{transform:translateY(0) rotate(-2.5deg);}50%{transform:translateY(-16px) rotate(2.5deg);}}
  @keyframes floatR{0%,100%{transform:translateY(0) rotate(2.5deg);}50%{transform:translateY(-13px) rotate(-2.5deg);}}
  @keyframes floatC{0%,100%{transform:scaleX(-1) translateY(0) rotate(0deg);}50%{transform:scaleX(-1) translateY(-12px) rotate(3deg);}}
  @media (prefers-reduced-motion:reduce){ .lpchar{animation:none !important;} }
  /* LP時のロビー：中身は濃紺のフェス風カードに載せて可読性キープ */
  #tv.lp .brand{display:none;}   /* LP時は小さいLIVE行を隠し、祭りリボンを唯一のヘッダに */
  #tv.lp #s_lobby, #tv.lp #s_prize{position:relative; z-index:4; background:linear-gradient(180deg,rgba(6,28,44,.80),rgba(5,22,36,.86));
    border-radius:30px; padding:24px 34px 30px; margin:0 auto; max-width:820px;
    box-shadow:0 24px 70px rgba(0,45,75,.4), inset 0 0 0 2px rgba(255,255,255,.28), inset 0 0 0 6px rgba(70,180,225,.18);}
  #tv.lp #s_prize{max-width:760px;}
  #tv.lp #s_lobby .title{font-size:clamp(26px,6cqw,46px);}
  #tv.lp #s_lobby .qrcta{margin-top:1.4cqh;}
  /* 祭りバナー（カード上部の金色ピル）＝LP時のみ表示。英字kickerはLP時に隠す */
  .lp-fest{display:none; margin:0 auto 8px; width:max-content; max-width:100%; font-family:var(--jp); font-weight:900; font-style:italic;
    font-size:clamp(15px,2.4cqw,24px); letter-spacing:.04em; color:#2a1500; padding:5px 20px; border-radius:99px;
    background:linear-gradient(180deg,#ffe9a8,var(--gold) 60%,#eaa61c); box-shadow:0 6px 16px rgba(255,190,40,.4), inset 0 0 0 2px rgba(255,255,255,.5);}
  #tv.lp .lp-fest{display:block; margin:2px auto 12px;}
  /* 文字の視認性UP（LP背景で薄くならないように） */
  #tv.lp #s_lobby .kicker{background:none; -webkit-background-clip:border-box; background-clip:border-box; color:#c9edff; -webkit-text-fill-color:#c9edff; text-shadow:0 1px 3px rgba(0,0,0,.45);}
  #tv.lp .lb .waitdot{color:#9fc6de;}
  #tv.lp #s_lobby .qsub{color:#93b6cc;}
</style>
</head>
<body>
<div id="tv">
<div class="brand"><span class="live">LIVE</span> ・ 神センス！スタートタイミング「0.15」チャレンジ</div>
<button class="mute" id="mute">🔊</button>
<div class="flash" id="flash"></div>
<div id="lpbg"></div>
<img class="lpchar" id="mascotL" alt="" src="img/naruchan.svg">
<img class="lpchar" id="mascotC" alt="" src="img/smile.svg">
<img class="lpchar" id="mascotR" alt="" src="img/gaarko.svg">
<div class="wrap">
  <!-- LOBBY -->
  <section class="screen on" id="s_lobby">
    <div class="kicker">神センス！ Boat Racer Start Timing</div>
    <div class="title">スタートタイミング<br><span class="accent en">「0.15」</span>チャレンジ</div>
    <div class="lobbyboats" id="lobbyBoats"></div>
    <div class="qrcta">QR から号艇をえらんで<br>スタート勝負に参加しよう！（全員参加・10艇）</div>
    <div class="qrjoin">
      <div class="qrcard"><div class="qimg" id="qrPlayer"></div><div class="qlbl">挑戦者エントリーはこちら</div><div class="qsub" id="uPlayer">/player</div></div>
    </div>
  </section>
  <!-- COUNTDOWN -->
  <section class="screen" id="s_count" style="text-align:center">
    <div class="qtext">スタート勝負！　大時計が消えたら感覚でPUSH</div>
    <div class="stage" id="stage" style="max-width:420px"></div>
    <div class="bigcount" id="doneCount">0 / 0 完了</div>
  </section>
  <!-- RESULT -->
  <section class="screen" id="s_result">
    <div class="qtext" style="text-align:center">結果発表 ／ 0秒にいちばん近い神スタートは？</div>
    <div class="board standings">
      <div class="bhead"><span class="venue"><span class="rc"></span>Result ／ 着順（0秒に近い順）</span><span class="rno"><span id="rnoR">R1</span></span></div>
      <div class="colhead"><span>枠</span><span>挑戦者</span><span>ST</span><span>賞</span></div>
      <div id="resultRows"></div>
    </div>
  </section>
  <!-- PRIZE -->
  <section class="screen" id="s_prize" style="text-align:center">
    <div class="qhead">🎁 Prize ／ 商品プレゼント（上位3名）</div>
    <div class="podium" id="podium"></div>
    <div class="paynote" id="payNote"></div>
  </section>
</div>
<div id="s_reveal">
  <canvas id="revealCanvas" width="1280" height="720"></canvas>
  <div class="rev-title" id="revTitle">結果発表<span class="sub">WHO GOT THE 神スタート ?</span></div>
  <div class="rev-winner" id="revWinner"></div>
  <div class="rev-vote" id="revVote"></div>
</div>
<div id="fanhype"></div>
<div class="conn" id="conn">● 接続中</div>
</div><!-- #tv -->
<script src="qrcode.min.js"></script>
<script src="shared.js"></script>
<script src="bgm.js"></script>
<script src="bgm.js"></script>
<script>
(()=>{ "use strict";
  const $=s=>document.querySelector(s);
  const TV=document.getElementById('tv');
  TV.insertAdjacentHTML('afterbegin', sceneHTML());
  // 16:9 横型モニター固定：1280×720キャンバスを画面に収まるよう等倍スケール（レターボックス）
  function fitTV(){ const s=Math.min(window.innerWidth/1280, window.innerHeight/720); TV.style.transform='translate(-50%,-50%) scale('+s+')'; }
  fitTV(); window.addEventListener('resize', fitTV); window.addEventListener('orientationchange', fitTV);
  $('#stage').innerHTML=clockSVG()+'<div class="cdnum en" id="cdnum">10</div><div class="blindmsg" id="blind"><div class="big">感覚勝負！</div><div class="small">AIM 0.15</div></div>';
  const scr={lobby:$('#s_lobby'),count:$('#s_count'),result:$('#s_result'),prize:$('#s_prize')};
  function show(n){ for(const k in scr) scr[k].classList.toggle('on',k===n); }
  const base=appUrl(); $('#uPlayer').textContent=base+'player';
  function mkQR(id,url){ try{ const el=document.getElementById(id); if(el && window.QRCode){ el.innerHTML=''; new QRCode(el,{text:url,width:300,height:300,colorDark:'#0e2b42',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); } }catch(e){} }
  mkQR('qrPlayer', base+'player');
  const bus=makeBus('screen');
  let cur=null, prevPhase='', prevPrize=false, revealing=false, revRaf=0, sndOff=false;
  function playBGM(cue,opt){ if(!sndOff){ try{ BGM.play(cue,opt); }catch(e){} } }   // サウンドOFF中は一切鳴らさない
  $('#mute').addEventListener('click',(e)=>{ e.stopPropagation(); sndOff=!sndOff; setMuted(sndOff); try{BGM.setMute(sndOff);}catch(x){}
    $('#mute').textContent=sndOff?'🔇':'🔊'; $('#mute').title=sndOff?'サウンドOFF（クリックでON）':'サウンドON（クリックでOFF）';
    if(sndOff){ try{BGM.stop();}catch(x){} }   // 完全停止（作業中の騒音対策）
    else { AC(); tone(880,0,.08,'sine',.12); if(cur&&cur.phase==='lobby')playBGM('parade',{loop:true}); } });
  document.addEventListener('click',()=>{ AC(); const p=(cur&&cur.phase)||'lobby'; if(p==='countdown')playBGM('fanfare'); else if(p!=='result'&&p!=='prize')playBGM('parade',{loop:true}); else playBGM('parade',{loop:true}); },{once:true});   // どのphaseでもクリックで音声解禁（結果中も一旦paradeで解禁だけ→次のcueへ）

  function names(){ return (cur&&cur.names)||new Array(N).fill(null); }
  function buildLobby(){ const nm=names(), jn=(cur&&cur.joined)||[]; let h='';
    for(let i=0;i<N;i++){ const j=jn[i]; const lbn=j?esc(nm[i]||''):'<span class="waitdot">参加待ち</span>'; h+=`<div class="lb ${j?'':'empty'}" style="--bc:${COL[i].b};--bt:${COL[i].t}"><div class="kw"><span>${i+1}</span></div><div class="lbn">${lbn}</div></div>`; }
    $('#lobbyBoats').innerHTML=h; }
  const MEDAL=['🥇','🥈','🥉'];
  function buildResult(){ const s=cur, order=ranking(s.results); const nm=names();
    const validOrder=order.filter(i=> s.joined[i] && s.results[i]!=null && s.results[i]>=0); const vRank={}; validOrder.forEach((i,r)=>vRank[i]=r);
    let h='';
    order.forEach(i=>{ if(!s.joined[i] && s.results[i]==null) return;   // 未参加枠は結果に出さない
      const st=s.results[i]; const stc= st==null?'<span class="stc pending">—</span>':(st<0?'<span class="stc foul">F</span>':'<span class="stc">'+st.toFixed(2)+'</span>');
      const vr=vRank[i]; const rk= vr!=null ? (vr+1)+'着' : (st!=null&&st<0?'F':'—');
      const medal= (vr!=null&&vr<3) ? MEDAL[vr] : '';
      h+=`<div class="brow ${(vr!=null&&vr<3)?'win':''}" style="--bc:${COL[i].b};--bt:${COL[i].t}"><div class="kw"><span>${i+1}</span></div><span class="rankbadge"><span>${rk}</span></span><div class="binfo"><div class="nm"><span class="txt">${esc(nm[i]||(i+1+'号艇'))}</span></div></div>${stc}<div class="odds" style="font-size:26px">${medal}</div></div>`; });
    $('#resultRows').innerHTML=h; }
  const RK3=['1着','2着','3着'];
  function buildPrize(){ const s=cur, order=ranking(s.results), nm=names();
    const top=order.filter(i=> s.joined[i] && s.results[i]!=null && s.results[i]>=0).slice(0,3);
    const pod=$('#podium');
    if(!top.length){ pod.innerHTML=''; $('#payNote').innerHTML='有効なスタートなし…次のラウンドへ！'; return; }
    pod.innerHTML=top.map((i,r)=>`<div class="pod ${r===0?'r1':''}"><div class="medal">${MEDAL[r]}</div><div class="rk">${RK3[r]}</div><div class="kw" style="--bc:${COL[i].b};--bt:${COL[i].t}"><span>${i+1}</span></div><div class="pnm">${esc(nm[i]||(i+1+'号艇'))}</div><div class="pst">${s.results[i].toFixed(2)}<small>秒</small></div></div>`).join('');
    $('#payNote').innerHTML=`0秒にいちばん近い <b>上位${top.length}名</b> に商品プレゼント！ おめでとうございます 🎉`;
    if(!prevPrize){ flashFx('p'); confetti(); fanfare(); } prevPrize=true; }
  function flashFx(c){ const f=$('#flash'); f.className='flash '+c; setTimeout(()=>f.className='flash',700); }

  // ===== 結果発表：助走→スタートを切る演出（周回なし・スタート重視／勝者=0秒に最接近＝上位3名が賞対象）=====
  function stopReveal(){ revealing=false; if(revRaf)cancelAnimationFrame(revRaf); revRaf=0; const r=$('#s_reveal'); if(r)r.classList.remove('on'); ['#revTitle','#revWinner','#revVote'].forEach(id=>{const e=$(id); if(e)e.classList.remove('show');}); const cv=$('#revealCanvas'); if(cv)cv.onclick=null; }
  function drumroll(){ try{ AC(); for(let k=0;k<20;k++){ tone(80+k*3, Math.max(0,k*(0.055-k*0.001)), 0.05,'square',0.09); } }catch(e){} }
  // ===== 結果発表：助走→スタートを切る演出（周回なし・スタートの瞬間を重視／9-1会議 変更C）=====
  function runReveal(s){
    const cv=$('#revealCanvas'); if(!cv||!cv.getContext){ show('result'); buildResult(); return; }
    revealing=true; const ctx=cv.getContext('2d'), W=1280, H=720;
    const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const KCOL=[]; for(let z=1;z<=N;z++) KCOL.push({b:cssv('--k'+z)||'#fff', t:cssv('--k'+z+'t')||'#111'});   // CanvasはCSS変数を解釈しないので実色に解決（10艇分）
    const nm=names(), order=ranking(s.results);
    const lanes=[]; for(let i=0;i<N;i++){ if(s.joined[i]||s.results[i]!=null) lanes.push(i); } if(!lanes.length) for(let i=0;i<N;i++)lanes.push(i);
    const rowOf={}; lanes.forEach((i,r)=>rowOf[i]=r);
    const validOrder=order.filter(i=> rowOf[i]!=null && s.results[i]!=null && s.results[i]>=0);
    const win=validOrder.length?validOrder[0]:-1, validWin=(win>=0);
    const top3=validOrder.slice(0,3);
    const allFoul=lanes.length>0 && lanes.every(i=> s.results[i]!=null && s.results[i]<0);
    const foul=i=>(s.results[i]!=null&&s.results[i]<0);
    // ===== 横型ストレート：左から助走してスタートライン(lineX=大時計0秒)を切る。周回はしない =====
    const top=104, bot=676, laneH=(bot-top)/lanes.length;
    const laneY=r=> top + laneH*(r+0.5);
    const lineX=930, V=250, SCALE=4.2, GUN=3.6, HOLD=5;   // V=通過速度 / SCALE=ST(秒)を見える距離差へ増幅 / GUN=号砲(raceT)
    const crossT={}; lanes.forEach(i=>{ const st=s.results[i]; crossT[i]=(st==null? GUN+1.4 : GUN + st*SCALE); });   // ST>=0は号砲後・フライング(ST<0)は号砲前にラインを切る
    const winCross = validWin? crossT[win] : GUN+0.5;
    const finishRaceT = winCross + 1.15;
    let raceT=0;
    function xOf(i){ const ct=crossT[i]; let x=lineX - V*(ct-raceT);   // 等速のフライングスタート：x=ライン-速度×(通過時刻-現在)
      if(foul(i) && raceT>ct){ const over=raceT-ct; x=lineX + V*Math.min(over,0.35) + V*Math.max(0,over-0.35)*0.12; }   // 早駆け後に急減速（周回しない）
      return x; }
    const t0=performance.now(); let launched=false, gunFired=false, finished=false, finishAt=0, lastFrame=performance.now();
    $('#revWinner').classList.remove('show'); $('#revWinner').innerHTML=''; $('#revVote').classList.remove('show'); $('#revVote').innerHTML='';
    $('#s_reveal').classList.add('on'); $('#revTitle').classList.add('show'); drumroll();
    playBGM('race',{loop:true});   // ※クリックでのスキップは無効（音声解禁クリックで演出が飛ぶのを防止。進行は運営ボタンで）
    function drawWater(T){
      const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#c7ebf9'); g.addColorStop(.5,'#7ccbe9'); g.addColorStop(1,'#4fa9d4'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);   // LP寄せ：昼のシアン水面
      for(let r=0;r<lanes.length;r++){ ctx.fillStyle= r%2? 'rgba(255,255,255,.05)':'rgba(0,60,90,.05)'; ctx.fillRect(0,top+laneH*r,W,laneH); }
      ctx.lineWidth=2; ctx.setLineDash([14,16]); ctx.strokeStyle='rgba(150,220,255,.16)';
      for(let r=0;r<=lanes.length;r++){ const y=top+laneH*r; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
      ctx.setLineDash([]);
      ctx.strokeStyle='rgba(255,255,255,.06)';
      for(let y=top+8;y<bot;y+=18){ ctx.beginPath(); for(let x=0;x<=W;x+=26){ const yy=y+Math.sin(x*0.02+T*1.8+y*0.08)*2.6; x===0?ctx.moveTo(x,yy):ctx.lineTo(x,yy);} ctx.stroke(); } }
    function drawStartLine(){
      for(let y=top;y<bot;y+=12){ ctx.fillStyle=(Math.floor(y/12)%2)?'#eef6ff':'#0a2230'; ctx.fillRect(lineX-6,y,12,12); }   // チェッカーの縦ライン
      ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.shadowColor=gunFired?'#25d17a':'#ff3b4e'; ctx.shadowBlur=gunFired?26:16; ctx.fillStyle=gunFired?'#25d17a':'#ff3b4e';
      ctx.fillRect(lineX-32,top-32,64,22); ctx.shadowBlur=0; ctx.fillStyle='#fff'; ctx.font='900 13px sans-serif'; ctx.fillText(gunFired?'START!':'READY',lineX,top-21);
      ctx.fillStyle='rgba(255,255,255,.55)'; ctx.font='800 15px sans-serif'; ctx.textAlign='left'; ctx.fillText('助走 →',24,top-17); ctx.restore(); }
    function boatDraw(i){ const x=xOf(i), y=laneY(rowOf[i]), col=KCOL[i].b, tcol=KCOL[i].t;
      const isFoul=foul(i), pulled=(isFoul&&raceT>crossT[i]+0.4), dim=pulled?0.5:1;
      ctx.save(); ctx.translate(x,y);
      ctx.globalAlpha=0.2*dim; ctx.fillStyle='#01121a'; ctx.beginPath(); ctx.ellipse(0,laneH*0.22,30,7,0,0,7); ctx.fill(); ctx.globalAlpha=dim;   // 影
      if(!pulled){ ctx.strokeStyle='rgba(220,248,255,.5)'; ctx.lineWidth=2;   // V字航跡（左へ）
        ctx.beginPath(); ctx.moveTo(-22,-5); ctx.quadraticCurveTo(-80,-9,-150,-24); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-22,5); ctx.quadraticCurveTo(-80,9,-150,24); ctx.stroke();
        const pg=ctx.createLinearGradient(-24,0,-120,0); pg.addColorStop(0,'rgba(255,255,255,.85)'); pg.addColorStop(1,'rgba(200,240,255,0)');
        ctx.fillStyle=pg; ctx.beginPath(); ctx.moveTo(-22,-9); ctx.lineTo(-120,-2); ctx.lineTo(-120,2); ctx.lineTo(-22,9); ctx.closePath(); ctx.fill(); }
      ctx.shadowColor=col; ctx.shadowBlur=14; ctx.fillStyle=col; ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=2;   // 船体（右向き）
      ctx.beginPath(); ctx.moveTo(34,0); ctx.quadraticCurveTo(4,-13,-26,-10); ctx.quadraticCurveTo(-18,0,-26,10); ctx.quadraticCurveTo(4,13,34,0); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
      ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(30,0); ctx.lineTo(-20,0); ctx.stroke();
      ctx.fillStyle=tcol; ctx.beginPath(); ctx.arc(4,0,11,0,7); ctx.fill();   // 番号
      ctx.fillStyle=col; ctx.font='900 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(i+1),4,.5);
      if(isFoul && raceT>crossT[i]){ ctx.fillStyle='#ff5a4d'; ctx.font='900 14px sans-serif'; ctx.textAlign='left'; ctx.fillText('フライング',40,-2); }
      ctx.restore(); }
    function drawClock(){ if(finished) return; const remain=GUN-raceT; ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
      if(remain>0.15){ const nsec=Math.max(1,Math.ceil(remain)); ctx.fillStyle='rgba(3,20,34,.5)'; ctx.beginPath(); ctx.arc(W/2,66,44,0,7); ctx.fill();
        ctx.fillStyle='#eaf6ff'; ctx.font='900 56px Anton, sans-serif'; ctx.fillText(String(nsec),W/2,70); }
      else if(raceT<GUN+0.9){ ctx.globalAlpha=Math.max(0,1-(raceT-GUN)/0.9); ctx.fillStyle='#fff2b0'; ctx.font='900 60px Anton, sans-serif'; ctx.fillText('スタート！',W/2,68); ctx.globalAlpha=1; }
      ctx.restore(); }
    function draw(T){ ctx.setTransform(1,0,0,1,0,0);
      drawWater(T); drawStartLine();
      lanes.forEach(i=> boatDraw(i));
      drawClock();
      const vg=ctx.createRadialGradient(W/2,H/2,H*0.36,W/2,H/2,H*0.86); vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(6,50,80,.3)'); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
      if(finished&&validWin){ ctx.fillStyle='rgba(2,10,18,.52)'; ctx.fillRect(0,0,W,H);
        const y=laneY(rowOf[win]);
        const lg=ctx.createLinearGradient(0,y-laneH*0.7,0,y+laneH*0.7); lg.addColorStop(0,'rgba(255,235,170,0)'); lg.addColorStop(.5,'rgba(255,235,170,.18)'); lg.addColorStop(1,'rgba(255,235,170,0)'); ctx.fillStyle=lg; ctx.fillRect(0,y-laneH*0.7,W,laneH*1.4);   // 勝者レーンをスポットライト
        const x=Math.min(xOf(win),lineX+70);
        const rg=ctx.createRadialGradient(x,y,8,x,y,120); rg.addColorStop(0,'rgba(255,240,190,.5)'); rg.addColorStop(1,'rgba(255,240,190,0)'); ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,120,0,7); ctx.fill();
        boatDraw(win);
        const fs=Math.max(0,T-finishAt);
        for(let n=0;n<24;n++){ const life=((fs*1.1)+(n*0.12))%1.7, ang=n*2.399, rad=20+life*150; const px=x+Math.cos(ang)*rad*0.7, py=y+Math.sin(ang)*rad-life*40; ctx.globalAlpha=Math.max(0,1-life/1.7); ctx.fillStyle=n%2?'#fff2b0':'#ffd24a'; ctx.beginPath(); ctx.arc(px,py,2.6,0,7); ctx.fill(); }   // 金の粒子
        ctx.globalAlpha=1; } }
    function onFinish(){ finished=true; finishAt=(performance.now()-t0)/1000; flashFx('p'); $('#revTitle').classList.remove('show');
      playBGM('result'); try{ confetti(); }catch(e){}   // 結果用mp3(bgm/common/result.mp3)を置けば本物に差替
      const w=$('#revWinner');
      if(validWin){ w.style.setProperty('--bc',COL[win].b); w.style.setProperty('--bt',COL[win].t);
        w.innerHTML='<div class="champ">🏆 CHAMPION ／ 1着</div><div class="lbl">0秒に最接近・神スタート</div><div class="nm"><span class="kwbig" style="--bc:'+COL[win].b+';--bt:'+COL[win].t+'">'+(win+1)+'</span><span class="nmtxt">'+esc(nm[win]||(win+1+'号艇'))+'</span></div><div class="st">ST <b>'+s.results[win].toFixed(2)+'</b> 秒</div>';
        w.classList.add('show');
        setTimeout(()=>{ if(!revealing)return; const rest=top3.slice(1); const v=$('#revVote');
          if(rest.length){ v.innerHTML='<div class="hit">'+rest.map((i,k)=>'🎖 '+(k+2)+'着 <b>'+esc(nm[i]||(i+1+'号艇'))+'</b>（'+s.results[i].toFixed(2)+'秒）').join('　／　')+'</div><div class="sub2">上位3名に 商品プレゼント</div>'; }
          else v.innerHTML='<div class="hit">🎁 上位3名に 商品プレゼント！</div>';
          v.classList.add('show'); },1400);
      } else { w.innerHTML='<div class="lbl">RESULT</div><div class="nm" style="font-size:54px">'+(allFoul?'全員フライング':'有効スタートなし')+'</div><div class="st">次のラウンドへ！</div>'; w.classList.add('show'); } }
    function endReveal(){ revealing=false; if(revRaf)cancelAnimationFrame(revRaf); revRaf=0; cv.onclick=null;
      $('#s_reveal').classList.remove('on'); $('#revTitle').classList.remove('show'); $('#revWinner').classList.remove('show'); $('#revVote').classList.remove('show');
      show('result'); buildResult(); }
    function frame(now){ if(!cur||cur.phase!=='result'){ stopReveal(); return; } const T=(now-t0)/1000;
      const dt=Math.min((now-lastFrame)/1000,0.05); lastFrame=now;   // dtをクランプ（タブ間引き時のワープ防止）
      if(!finished){ const near=(validWin && raceT>winCross-0.6 && raceT<winCross+0.4); raceT += dt*(near?0.4:1); }   // 勝者通過付近はスローモーション
      if(!gunFired && raceT>=GUN){ gunFired=true; flashFx(''); try{ tone(280,0,.18,'sawtooth',.16);}catch(e){} }   // 号砲＝ライン緑＋フラッシュ
      if(!launched && T>=1.0){ launched=true; $('#revTitle').classList.remove('show'); }
      draw(T);
      if(!finished && raceT>=finishRaceT) onFinish();
      if(finished && T>finishAt+HOLD){ endReveal(); return; }
      revRaf=requestAnimationFrame(frame); }
    revRaf=requestAnimationFrame(frame);
  }

  // ===== 発走ファンファーレ演出（go→ファンファーレの間、大時計スタンバイの代わりに"煽り"を出す）=====
  const fanhype=$('#fanhype'); let hypeRushT=0;
  const VNM={naruto:'鳴門',kojima:'児島',marugame:'丸亀'};
  function startHype(ms){
    if(ms<1200){ endHype(); return; }   // 復元などで残り時間が短い時は演出せず時計へ
    const nm=names(), jn=(cur&&cur.joined)||[], venue=VNM[(cur&&cur.venue)]||'';
    let boats=''; for(let i=0;i<N;i++){ const j=jn[i];
      boats+=`<div class="fh-boat ${j?'jn':''}" style="--bc:${COL[i].b};--bt:${COL[i].t}"><div class="fh-kw"><span>${i+1}</span></div>${boatSVG()}<div class="fh-nm">${j?esc(nm[i]||(i+1+'号艇')):'—'}</div></div>`; }
    fanhype.innerHTML=`<div class="fh-rays"></div><div class="fh-light l1"></div><div class="fh-light l2"></div>`+
      `<div class="fh-top">${venue?('<b>'+venue+'</b> ・ '):''}R${(cur&&cur.round)||1} ・ START TIMING BATTLE</div>`+
      `<div class="fh-mid"><div class="fh-kicker">GET READY</div><div class="fh-title">まもなく発走！</div><div class="fh-sub">大時計に集中！ ねらうは <b>0.15</b></div></div>`+
      `<div class="fh-boats">${boats}</div>`+
      `<div class="fh-barwrap"><div class="fh-barlabel">発走まで</div><div class="fh-bar"><i id="fhBarFill"></i></div></div>`;
    fanhype.classList.remove('rush'); fanhype.classList.add('on');
    const fill=$('#fhBarFill');
    if(fill){ fill.style.transition='none'; fill.style.width='0%';
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ fill.style.transition='width '+ms+'ms linear'; fill.style.width='100%'; })); }   // 発走までのアンカーバーを尺ぴったりで満タンに
    clearTimeout(hypeRushT); hypeRushT=setTimeout(()=>{ if(!fanhype.classList.contains('on'))return;
      fanhype.classList.add('rush'); const t=fanhype.querySelector('.fh-title'), su=fanhype.querySelector('.fh-sub');
      if(t)t.textContent='構えて！！'; if(su)su.innerHTML='大時計が<b>消えたら</b>PUSH！'; }, Math.max(0,ms-3000));   // ラスト3秒で赤く加速
  }
  function endHype(){ clearTimeout(hypeRushT); if(fanhype){ fanhype.classList.remove('on','rush'); fanhype.innerHTML=''; } }

  // 大時計（表示専用・go信号で開始）
  const cdnum=()=>$('#cdnum'), blind=()=>$('#blind'), hand=()=>$('#hand'), prog=()=>$('#progress'), clk=()=>$('#clockSvg');
  let raf=0,t0=0,hidden=false,lastB=99, running=false, goAtV=0;
  function startClock(){ endHype(); playBGM('race',{loop:true});   // 大時計スタート＝BGMを止めてボートの走行音に（10秒カウント中）
    running=true; hidden=false; lastB=99; cdnum().classList.remove('hide'); blind().classList.remove('on'); clk().classList.remove('gone'); cdnum().textContent='10'; prog().style.strokeDashoffset=RING_LEN; hand().style.transform=''; t0=performance.now()-Math.max(0,Math.min(bus.serverNow()-goAtV,3000)); cancelAnimationFrame(raf); raf=requestAnimationFrame(loop); }   // t0を真の発走時刻(goAt)にアンカー
  function loop(now){ const el=(now-t0)/1000, remain=ZERO_AT-el, frac=Math.min(el/ZERO_AT,1);
    if(!hidden){ prog().style.strokeDashoffset=RING_LEN*(1-frac); hand().style.transform=`rotate(${frac*360}deg)`; hand().style.transformOrigin='100px 100px';
      if(remain>HIDE_REMAIN){ cdnum().textContent=Math.max(0,Math.ceil(remain)); const s=Math.ceil(remain); if(s!==lastB){lastB=s; tone(760,0,.06,'sine',.14);} }
      else { hidden=true; cdnum().classList.add('hide'); blind().classList.add('on'); clk().classList.add('gone'); } }
    if(el<ZERO_AT+2.8){ raf=requestAnimationFrame(loop); } else { running=false; } }

  function armClock(){ try{ running=false; cancelAnimationFrame(raf); cdnum().classList.remove('hide'); blind().classList.remove('on'); clk().classList.remove('gone'); cdnum().textContent='10'; prog().style.strokeDashoffset=RING_LEN; hand().style.transform=''; }catch(e){} }
  bus.onMessage(m=>{ if(m.type==='state'){ cur=m.s; onState(m.s); } else if(m.type==='go'){ show('count'); armClock(); playBGM('fanfare'); goAtV=m.goAt||0; const delay=goAtV-bus.serverNow(); startHype(delay); setTimeout(()=>{ startClock(); }, Math.max(0,delay)); } });   // 発走ファンファーレ中は"煽り演出"(#fanhype)→流し切ったら大時計(よーいドン)
  function onState(s){
    BGM.setVenue(s.venue||'naruto');
    // LP寄せ背景＋会場キャラは ロビー・商品プレゼント で表示（発走/大時計/結果演出は専用背景のまま）
    const lp=(s.phase==='lobby'||s.phase==='prize');
    TV.classList.toggle('lp', lp);
    ['#mascotL','#mascotC','#mascotR'].forEach(id=>{ const e=$(id); if(e) e.classList.toggle('on', lp); });
    if(s.phase!=='result') stopReveal();
    if(s.phase!=='countdown') endHype();   // カウントダウン以外へ移ったら煽り演出を確実に閉じる
    if(s.phase!=='prize') prevPrize=false;
    $('#rnoR').textContent='R'+s.round;
    if(s.phase==='lobby'){ show('lobby'); buildLobby(); }
    else if(s.phase==='countdown'){ show('count'); if(!running && prevPhase!=='countdown') { /* 待機表示。go信号で開始 */ }
      const jc=s.joined.filter(Boolean).length, rc=s.results.filter((r,i)=>s.joined[i]&&r!=null).length; $('#doneCount').textContent=rc+' / '+jc+' 完了'; }
    else if(s.phase==='result'){ if(!revealing){ if(prevPhase!=='result'){ runReveal(s); } else { show('result'); buildResult(); } } }
    else if(s.phase==='prize'){ stopReveal(); show('prize'); buildPrize(); }
    if(s.phase!==prevPhase){
      if(s.phase==='lobby'){ if(prevPhase!=='lobby') playBGM('parade',{loop:true}); }
      else if(s.phase==='countdown'){ /* 発走ファンファーレはgo信号で鳴らす（→間→大時計） */ }
    }
    prevPhase=s.phase;
  }
})();
</script>
